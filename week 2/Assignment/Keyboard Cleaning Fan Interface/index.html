<div class="device">

    <div class="top-bar">

        <h1>Keyboard Cleaner</h1>

        <div class="battery">
            Battery
            <strong>82%</strong>
        </div>

    </div>


    <div class="status">

        <h2>Ready</h2>

        <div class="status-code">
            SYS / 01<br>
            AIR UNIT ONLINE
        </div>

    </div>


    <div class="section-title">
        01 / Select Cleaning Mode
    </div>


    <div class="mode-buttons">

        <button class="active">

            <span class="mode-index">01</span>

            <span class="mode-name">
                Jet
            </span>

            <span class="mode-description">
                Focused / High Pressure
            </span>

        </button>


        <button>

            <span class="mode-index">02</span>

            <span class="mode-name">
                Sweep
            </span>

            <span class="mode-description">
                Wide / Surface Cleaning
            </span>

        </button>

    </div>


    <div class="power-section">

        <div class="power-header">

            <h3>
                02 / Air Power
            </h3>

            <div class="power-value">
                75%
            </div>

        </div>


        <div class="power-bar">

            <div class="power-fill"></div>

        </div>

    </div>


    <button class="start-button">
        Start Cleaning →
    </button>


    <div class="system-info">

        <span>Unit KC-01</span>

        <span>Motor Ready</span>

        <span>Temp Normal</span>

    </div>

</div>
