<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fan Display Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="top-area">

        <div class="display-area">
            <canvas id="screen" width="240" height="240"></canvas>
        </div>

        <div class="scale-panel">

            <label for="scaleInput">Display Scale</label>

            <input
                id="scaleInput"
                type="number"
                min="1"
                max="10"
                step="1"
                value="1"
            >

            <div class="scale-buttons">
                <button id="applyScale">Apply</button>
                <button id="resetScale">Reset</button>
            </div>

        </div>

    </div>


    <div class="control-panel">

        <div class="control-row">
            <label for="batterySlider">Battery</label>
            <div class="slider-line">
                <input
                    id="batterySlider"
                    type="range"
                    min="0"
                    max="99"
                    step="1"
                    value="82"
                >
                <span id="batteryText">82</span>
            </div>
        </div>

        <div class="control-row">
            <label for="speedSlider">Fan Speed</label>
            <div class="slider-line">
                <input
                    id="speedSlider"
                    type="range"
                    min="0"
                    max="100"
                    step="1"
                    value="0"
                >
                <span id="speedText">0</span>
            </div>
        </div>

        <div class="control-row">
            <label for="openingSlider">Fan Opening</label>
            <div class="slider-line">
                <input
                    id="openingSlider"
                    type="range"
                    min="1"
                    max="90"
                    step="1"
                    value="35"
                >
                <span id="openingText">35</span>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
